services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todoapp_mssql
    environment:
      SA_PASSWORD: "SqlPass@123456"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./entrypoint-mssql.sh:/entrypoint-mssql.sh
    networks:
      - todoapp_network
    entrypoint: /bin/bash /entrypoint-mssql.sh
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoapp_api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=TodoDb;User Id=sa;Password=SqlPass@123456;Encrypt=false;Connection Timeout=30;"
      SA_PASSWORD: "SqlPass@123456"
    ports:
      - "5000:8080"
    depends_on:
      - mssql
    networks:
      - todoapp_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todoapp_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - todoapp_network
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local

networks:
  todoapp_network:
    driver: bridge
